name: projectnagarsathi
description: "NagarSathi - a Flutter application."
publish_to: 'none'
version: 1.1.2+3

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  cupertino_icons: ^2.0.0
  shorebird_code_push: ^2.0.7
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_functions: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/icon/icon.png
    - assets/icon/google_g.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900

# Regenerate Android launcher icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
